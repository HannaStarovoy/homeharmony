/* === МАГАЗИН ДОСТУПНЫХ ЦЕН: практичный интерфейс === */
:root{--bg:#f7f9fc;--paper:#fff;--text:#202935;--muted:#657181;--subtle:#8291a0;--line:#e2e8ef;--accent:#1769e0;--accent-dark:#0d55bb;--soft:#f3f6fa;--warm:#eaf3ff;--danger:#e02b39;--radius:12px;--shadow:0 4px 20px #27436712}
body{background:var(--bg);color:var(--text)}
.container{max-width:1240px;padding-left:24px;padding-right:24px}
.serif{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;font-weight:800;letter-spacing:-.035em}
.announcement{height:27px;background:#1c4483;color:#e4efff;font-size:10px;letter-spacing:.025em}
.header{box-shadow:0 2px 8px #163f7710;border-bottom:1px solid var(--line);background:#fff}
.header-main{height:75px;gap:25px}
.brand{font-size:17px;font-weight:850;letter-spacing:-.045em}
.brand-mark{background:#1868dc;border:0;border-radius:9px;color:#fff;font:900 18px Arial;width:33px;height:33px}
.nav{gap:23px;flex:0 0 auto}.nav button{font-size:13px;font-weight:650}
.header-icons{margin-left:auto;gap:18px}.header-search{border:1px solid #d2dce9;background:#f7faff;border-radius:9px;padding:0 12px;min-width:230px;width:min(22vw,320px)}.header-search input{font-size:13px;padding:11px 0}.header-search button{color:#226cd4}.cart-count{background:#eb3947}
.btn{background:#1769e0;border-color:#1769e0;border-radius:9px;letter-spacing:0;font-size:13px;font-weight:750;min-height:43px}.btn:hover:not(:disabled){background:#1058c1;border-color:#1058c1}
.btn-outline{background:#fff;color:#1769e0;border-color:#b5cff4}.btn-outline:hover:not(:disabled){color:#fff}.btn-sm{border-radius:8px}
.page-heading{font-size:35px}.section-title h2{font-size:27px}.section{padding:35px 0}
.product-grid{gap:13px;grid-template-columns:repeat(4,minmax(0,1fr))}
.product-card{background:#fff;border:1px solid #e6ebf2;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .15s,transform .15s}
.product-card:hover{box-shadow:0 9px 25px #224d8918;transform:translateY(-1px)}
.product-visual{aspect-ratio:1/.91;background:#f3f5f7}.product-visual>svg{width:100%;height:100%;object-fit:contain}.product-visual:hover>svg{transform:scale(1.025)}
.product-card-meta{padding:11px 12px 12px;display:flex;flex:1;flex-direction:column;align-items:stretch}
.product-name{font-size:13px;line-height:1.45;font-weight:600;min-height:37px}
.product-sub{font-size:11px;margin:3px 0 8px;color:#778292}
.price{font-size:22px;font-weight:850;letter-spacing:-.05em;color:#252d3d;white-space:nowrap}
.old-price{font-size:12px;color:#949da8}
.swatches{margin-top:8px;gap:5px}.swatch{width:14px;height:14px}
.quick-add{border-top:0;padding-top:10px;margin-top:auto}.quick-add button{border:1px solid #cddff7;border-radius:8px;color:#1764ce;background:#eef5ff;display:flex;align-items:center;justify-content:center;width:100%;padding:10px 6px;font-size:12px;font-weight:750;min-height:35px}.quick-add button:hover{background:#e0ecff}.quick-add button:disabled{opacity:.5}
.pill{font-size:11px;border-radius:6px;font-weight:750;padding:6px 8px;background:#e5efff;color:#1764ce;letter-spacing:0;top:10px;left:10px}
.pill.sale{background:#e52b3b;color:#fff}

 const v=getVariant(p,variantIndex)||{color:'#aea292',name:''}; const color=v.color; const bg={hat:['#e2ded4','#d0cdc5'],mittens:['#e9e2da','#dbd2c8'],scarf:['#e8e5dd','#ded4c8'],headband:['#dfdfd8','#d4d5cf'],shampoo:['#e9e7de','#ddd9ca'],conditioner:['#e3e4da','#d5d7ca'],kit:['#e7e3d9','#dcd4c4'],jar:['#e8e4db','#d8d5ca']}[p.type]||['#ebe7de','#d6d0c5'];

function scopedProducts(){return products.filter(p=>inCategory(p,state.cat))}
function availableColors(){const colors=new Map();scopedProducts().forEach(p=>p.variants.filter(v=>v.options.Цвет).forEach(v=>colors.set(v.options.Цвет,{name:v.options.Цвет,hex:v.color})));return [...colors.values()].sort((a,b)=>a.name.localeCompare(b.name,'ru'))}
function attributeOptions(){
 const options=new Map();
 scopedProducts().forEach(p=>{
  Object.entries(p.attrs).forEach(([key,value])=>{if(!options.has(key))options.set(key,new Set());options.get(key).add(value)});
  p.variants.forEach(v=>Object.entries(v.options).filter(([key])=>key!=='Цвет').forEach(([key,value])=>{if(!options.has(key))options.set(key,new Set());options.get(key).add(value)}));
 });
 return [...options].map(([key,values])=>({key,values:[...values].sort((a,b)=>a.localeCompare(b,'ru'))}));
}
function priceBounds(){const prices=scopedProducts().flatMap(p=>p.variants.map(v=>skuPrice(p,v)));return {min:prices.length?Math.floor(Math.min(...prices)):0,max:prices.length?Math.ceil(Math.max(...prices)):0}}
function matchingVariants(p){return p.variants.filter(v=>
 (!(state.collection==='sale'||state.onlySale)||skuOld(p,v)>skuPrice(p,v))&&
 (!state.onlyStock||v.stock>0)&&(!state.filterColor||v.options.Цвет===state.filterColor)&&
 (state.minPrice===null||skuPrice(p,v)>=state.minPrice)&&(state.maxPrice===null||skuPrice(p,v)<=state.maxPrice)&&
 Object.entries(state.attributes).every(([key,values])=>values.includes(v.options[key]??p.attrs[key]))
)}
const matchingPrice=p=>Math.min(...matchingVariants(p).map(v=>skuPrice(p,v)));
function catalogProducts(){
 let ps=scopedProducts();
 if(state.collection==='new')ps=ps.filter(p=>p.tag==='Новинка');
 if(state.query){const words=normalize(state.query).trim().split(/\s+/);ps=ps.filter(p=>{const text=normalize([p.name,p.summary,p.id,...categoryPath(p.cat).map(c=>c.name),...Object.values(p.attrs),...p.variants.map(v=>v.sku)].join(' '));return words.every(w=>text.includes(w))})}
 ps=ps.filter(p=>matchingVariants(p).length);
 return ps.sort((a,b)=>(state.sort==='price-asc'?matchingPrice(a)-matchingPrice(b):state.sort==='price-desc'?matchingPrice(b)-matchingPrice(a):state.sort==='new'?b.date-a.date:b.pop-a.pop)||a.id.localeCompare(b.id));
}
function renderCategoryTree(parent='all',depth=0){return categories.filter(c=>c.parent===parent).map(c=>`<li><button class="category-node ${state.cat===c.id?'active':''}" data-category="${c.id}" ${state.cat===c.id?'aria-current="true"':''}>${esc(c.name)} <span>${products.filter(p=>inCategory(p,c.id)).length}</span></button>${categories.some(x=>x.parent===c.id)?`<ul>${renderCategoryTree(c.id,depth+1)}</ul>`:''}</li>`).join('')}

function selectedFilters(){
 const chip=(key,label,value='')=>`<button class="selected-filter" data-remove-filter="${esc(key)}" data-value="${esc(value)}" aria-label="Убрать фильтр: ${esc(label)}">${esc(label)} ${I('close',12)}</button>`;
 const chips=[];
 if(state.query)chips.push(chip('query','Поиск: '+state.query));
 if(state.collection)chips.push(chip('collection',state.collection==='sale'?'Скидки':'Новинки'));
 if(state.minPrice!==null)chips.push(chip('minPrice','От '+money(state.minPrice)));
 if(state.maxPrice!==null)chips.push(chip('maxPrice','До '+money(state.maxPrice)));

bel></fieldset>${state.error?`<div class="error" role="alert">${esc(state.error)}</div>`:''}<button type="submit" class="btn btn-wide" ${state.submitting||!orderingEnabled?'disabled':''}>${state.submitting?'Отправляем заказ…':'Отправить заказ'} ${I('arrow',16)}</button></form>${checkoutSummary()}</div></main>`;

async function acceptReceipt(receipt,key){
 if(!validReceipt(receipt))throw new Error('Некорректное подтверждение сервера. Повторите отправку.');
 state.receipt=receipt;writeSession('store-last-order',{key,receipt});
 state.orderAttempt=null;writeSession('store-order-attempt',null);
 state.cart=[];saveCart();state.fields={name:'',phone:'',email:'',city:'',address:'',note:''};state.agree=false;nav('confirmed');
 try{await refreshCart()}catch{}
}
async function refreshCart(){
 const response=await fetch('/api/catalog',{cache:'no-store',signal:AbortSignal.timeout(10000)});if(!response.ok)throw new Error('Не удалось обновить корзину. Обновите страницу.');
 const data=await response.json();products.splice(0,products.length,...data.products);if(data.checkout)Object.assign(checkoutConfig,data.checkout);
 state.cart=state.cart.flatMap(item=>{const v=itemVariant(item);return v&&v.stock>0?[{...item,qty:Math.min(v.stock,item.qty)}]:[]});saveCart();
}
async function sendOrder(){
 if(state.submitting||!orderingEnabled)return;
 const f=state.fields;
 if(!f.name.trim()||f.phone.replace(/\D/g,'').length<7||!f.city.trim()||(state.delivery!=='pickup'&&!f.address.trim())){state.error='Заполните имя, телефон, город и адрес доставки (если требуется).';render();return}
 if(!state.agree){state.error='Подтвердите согласие на обработку данных для оформления заказа.';render();return}
 const payload={customer:{...f},delivery:state.delivery,payment:'manual',consent:true,shippingCents:Math.round(shipping()*100),items:state.cart.map(item=>({id:item.id,sku:item.sku,qty:item.qty,priceCents:Math.round(unitPrice(item)*100)}))};
 state.submitting=true;state.error='';render();let responded=false;
 try{
  const digest=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(JSON.stringify(payload))))).map(n=>n.toString(16).padStart(2,'0')).join('');
  const attempt=state.orderAttempt?.digest===digest?state.orderAttempt:{key:crypto.randomUUID(),digest};state.orderAttempt={...attempt,pending:true};writeSession('store-order-attempt',state.orderAttempt);
  const response=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json','Idempotency-Key':attempt.key},body:JSON.stringify(payload),signal:AbortSignal.timeout(15000)});
  const data=await response.json();responded=true;
  if(!response.ok){state.orderAttempt.pending=false;writeSession('store-order-attempt',state.orderAttempt);if(data.code==='CART_CHANGED'){await refreshCart();state.page='cart';writeLocation();}throw new Error(data.message||'Не удалось оформить заказ.');}
  await acceptReceipt(data,attempt.key);
 }catch(error){state.error=responded?error.message:'Подтверждение не получено. Повторите отправку: повторный заказ не создастся.';}finally{state.submitting=false;render()}
}
async function recoverReceipt(){
 const pending=state.orderAttempt?.pending,last=readSession('store-last-order'),key=pending?state.orderAttempt.key:state.page==='confirmed'?last?.key:null;
 if(!orderingEnabled||!key)return;
 try{const response=await fetch('/api/orders/receipt',{headers:{'Idempotency-Key':key},cache:'no-store',signal:AbortSignal.timeout(10000)});if(response.ok){const receipt=await response.json();if(pending)await acceptReceipt(receipt,key);else if(validReceipt(receipt)){state.receipt=receipt;writeSession('store-last-order',{key,receipt});render()}}}catch{}
}

 const url=new URL(location.href);url.search='';const q=url.searchParams;
 if(state.page!=='home')q.set('view',state.page);
 if(state.cat!=='all')q.set('cat',state.cat);
 if(state.query)q.set('q',state.query);
 if(state.collection)q.set('collection',state.collection);
 if(state.sort!=='popular')q.set('sort',state.sort);
 for(const [key,param] of [['minPrice','min'],['maxPrice','max']])if(state[key]!==null)q.set(param,state[key]);
 if(state.onlyStock)q.set('stock','1');if(state.onlySale)q.set('sale','1');
 if(state.filterColor)q.set('color',state.filterColor);
 for(const key of Object.keys(state.attributes).sort())for(const value of [...state.attributes[key]].sort())q.append('attr.'+key,value);
 if(state.catalogPage>1)q.set('page',state.catalogPage);
 if(state.pageSize!==12)q.set('size',state.pageSize);
 if(state.page==='product'){q.set('product',state.productId);const v=selectedVariant(find(state.productId));if(v)q.set('sku',v.sku)}
 if(state.page==='info')q.set('info',state.info||'delivery');
 if(state.page==='home'&&q.size)q.set('view','home');
 if(url.href!==location.href)history[replace?'replaceState':'pushState'](null,'',url);
}
function readLocation(){
 resetFilters();state.cat='all';state.pageSize=12;state.filtersOpen=false;state.menuOpen=false;state.mobileSearch=false;
 const q=new URL(location.href).searchParams;
 state.page=['home','catalog','product','cart','checkout','confirmed','info'].includes(q.get('view'))?q.get('view'):(q.size?'catalog':'home');
 if(state.page==='confirmed'&&!state.receipt)state.page='cart';
 state.cat=category(q.get('cat')).id;state.query=(q.get('q')||'').trim();
 if(['sale','new'].includes(q.get('collection')))state.collection=q.get('collection');
 if(['popular','new','price-asc','price-desc'].includes(q.get('sort')))state.sort=q.get('sort');
 for(const [key,param] of [['minPrice','min'],['maxPrice','max']]){const raw=q.get(param),n=Number(raw);if(raw!==null&&raw.trim()!==''&&Number.isFinite(n)&&n>=0)state[key]=n}
 state.onlyStock=q.get('stock')==='1';state.onlySale=q.get('sale')==='1';
 if(availableColors().some(c=>c.name===q.get('color')))state.filterColor=q.get('color');
 if(state.cat!=='all')for(const {key,values} of attributeOptions()){const selected=[...new Set(q.getAll('attr.'+key))].filter(v=>values.includes(v));if(selected.length)state.attributes[key]=selected}
 const page=Number(q.get('page'));if(Number.isSafeInteger(page)&&page>0)state.catalogPage=page;
 const size=Number(q.get('size'));if([12,24,48].includes(size))state.pageSize=size;
 if(state.page==='product'){const p=find(q.get('product'));if(p){state.productId=p.id;const idx=p.variants.findIndex(v=>v.sku===q.get('sku'));chooseVariant(p,idx>=0?idx:Math.max(0,p.variants.findIndex(v=>v.stock>0)))}else state.page='catalog'}
 if(state.page==='info')state.info=['delivery','returns','contacts'].includes(q.get('info'))?q.get('info'):'delivery';
 catalogWindow();
}
window.addEventListener('popstate',()=>{readLocation();render();writeLocation(true)});
function addToCart(id,variantIndex,qty){
 const p=find(id),v=p?.variants[variantIndex];
 if(!v||!Number.isSafeInteger(qty)||qty<=0)return;
 const old=state.cart.find(x=>x.id===id&&x.sku===v.sku);
 if(qty>remaining(p,v)){withToast('Доступного количества недостаточно');return}
 if(old)old.qty+=qty;else state.cart.push({id,sku:v.sku,qty});
 if(state.page==='product')state.qty=Math.min(state.qty,Math.max(1,remaining(p,v)));
 saveCart();withToast('Товар добавлен в корзину');
}
let toastTimer;function withToast(msg){state.toast=msg;render();clearTimeout(toastTimer);toastTimer=setTimeout(()=>{state.toast='';render()},2600)}
document.addEventListener('click',e=>{if(state.submitting)return;let t=e.target.closest('button');if(!t)return;const d=t.dataset;
 if(d.action==='menu'){state.menuOpen=!state.menuOpen;state.mobileSearch=false;render();return}
 if(d.action==='mobileSearch'){state.mobileSearch=!state.mobileSearch;state.menuOpen=false;render();return}
 if(d.collection){resetFilters();state.collection=d.collection;state.cat='all';nav('catalog');return}
 if(d.info){state.info=d.info;nav('info');return}
 if(d.go){if(d.cat!==undefined){resetFilters();state.cat=d.cat}nav(d.go);return}
 if(d.product){state.productId=d.product;const p=find(d.product);const matches=state.page==='catalog'?matchingVariants(p):p.variants;const v=p.variants.find(v=>v.sku===d.sku)||matches.find(v=>v.stock>0)||matches[0]||p.variants[0];chooseVariant(p,p.variants.indexOf(v));nav('product');return}
 if(d.action==='filters'){state.filtersOpen=!state.filtersOpen;render();document.querySelector(state.filtersOpen?'.filters-close':'.catalog-toolbar .filter-toggle')?.focus();return}
 if(d.category){selectCategory(d.category);return}
 if(d.catalogPage){state.catalogPage=Number(d.catalogPage);updateCatalog(false);document.querySelector('.catalog-toolbar')?.scrollIntoView({block:'start'});return}
 if(d.removeFilter){const key=d.removeFilter;if(key==='attribute'){const [attr,value]=JSON.parse(d.value);state.attributes[attr]=state.attributes[attr].filter(v=>v!==value);if(!state.attributes[attr].length)delete state.attributes[attr]}else state[key]=key==='minPrice'||key==='maxPrice'?null:key==='onlyStock'||key==='onlySale'?false:'';updateCatalog();return}
 if(d.action==='resetFilters'){resetFilters();updateCatalog();return}
 if(d.filterColor!==undefined){state.filterColor=state.filterColor===d.filterColor?'':d.filterColor;updateCatalog();return}
 if(d.option){state.selectedOptions[d.option]=d.value;const p=find(state.productId),v=selectedVariant(p);if(v)chooseVariant(p,p.variants.indexOf(v));render();writeLocation();document.querySelector(`[data-option="${CSS.escape(d.option)}"][data-value="${CSS.escape(d.value)}"]`)?.focus();return}
 if(d.gallery!==undefined){state.gallery=Number(d.gallery);render();return}
 if(d.qty!==undefined){const p=find(state.productId),v=selectedVariant(p),max=v?remaining(p,v):0;state.qty=Math.min(max||1,Math.max(1,state.qty+Number(d.qty)));render();return}
 if(d.add){addToCart(d.add,Number(d.variantIndex||0),Number(d.qtyAdd||1));return}
 if(d.cartRemove!==undefined){state.cart.splice(Number(d.cartRemove),1);saveCart();render();return}
 if(d.cartQty){let [idx,step]=d.cartQty.split(':').map(Number);let item=state.cart[idx];if(!item)return;let max=itemVariant(item).stock;item.qty=Math.min(max,Math.max(0,item.qty+step));if(item.qty===0)state.cart.splice(idx,1);saveCart();render();return}
});
document.addEventListener('input',e=>{if(e.target.dataset.field)state.fields[e.target.dataset.field]=e.target.value});
document.addEventListener('change',e=>{const d=e.target.dataset;
 if(d.sort!==undefined){state.sort=e.target.value;updateCatalog();return}
 if(d.pageSize!==undefined){state.pageSize=Number(e.target.value);updateCatalog();return}
 if(d.price){const raw=e.target.value,n=Number(raw);state[d.price]=raw!==''&&Number.isFinite(n)&&n>=0?n:null;updateCatalog();return}
 if(d.attribute){const values=new Set(state.attributes[d.attribute]||[]);if(e.target.checked)values.add(e.target.value);else values.delete(e.target.value);if(values.size)state.attributes[d.attribute]=[...values];else delete state.attributes[d.attribute];updateCatalog();return}
 if(d.filter==='onlyStock'||d.filter==='onlySale'){state[d.filter]=e.target.checked;updateCatalog();return}
 if(e.target.name==='delivery'){state.delivery=e.target.value;render();return}if(e.target.name==='payment'){state.payment=e.target.value;render();return}if(e.target.id==='agree'){state.agree=e.target.checked;return}
});
document.addEventListener('submit',e=>{if(e.target.matches('[data-search]')){e.preventDefault();const q=e.target.querySelector('input[name="query"]')?.value||'';resetFilters();state.query=q.trim();state.cat='all';nav('catalog');return}if(e.target.id==='checkout-form'){e.preventDefault();sendOrder();return}});
readLocation();
render();
writeLocation(true);
recoverReceipt();
})();
</script>
</body>
