<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#000000" />
<title>Магазин доступных цен — интерактивный прототип</title>
<style>
/* Storefront design: warm editorial surfaces, quiet accents, generous typography. */
:root {
  --bg: #ffffff;
  --paper: #fff;
  --text: #292d28;
  --muted: #696d63;
  --subtle: #5f6658;
  --line: #ddded5;
  --accent: #313a30;
  --accent-dark: #20281f;
  --accent-ink: #566047;
  --on-accent: #fffdf7;
  --accent-line: #c9c5b6;
  --focus: #88734b;
  --soft: #f4f5f6;
  --warm: #eceef0;
  --danger: #984a52;
  --radius: 12px;
  --shadow: 0 16px 40px #2d342612;
  font-family: Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
  color: var(--text);
  background: var(--bg);
  font-size: 17px;
  font-synthesis: none;
}
* {
  box-sizing: border-box;
}
html {
  scroll-behavior: smooth;
}
body {
  margin: 0;
  line-height: 1.55;
}
button,input,select,textarea {
  font: inherit;
}
button {
  cursor: pointer;
}
button:disabled {
  cursor: not-allowed;
  opacity: .48;
}
a {
  color: inherit;
  text-decoration: none;
}
button {
  color: inherit;
}
button,input,textarea,select {
  -webkit-tap-highlight-color: transparent;
}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 3px;
}
button svg {
  flex-shrink: 0;
}
.container {
  max-width: 1440px;
  margin: 0 auto;
  padding: 0 40px;
}
.serif {
  font-family: Georgia,'Times New Roman',serif;
  font-weight: 400;
  letter-spacing: -.03em;
}
.muted {
  color: var(--muted);
}
.small {
  font-size: 14px;
}
.eyebrow {
  font-size: 13px;
  letter-spacing: .11em;
  font-weight: 750;
  text-transform: uppercase;
  color: var(--accent-ink);
}
/* Header */
.announcement {
  background: #000000;
  font-size: 13px;
  color: #5f6658;
}
.utility-row {
  min-height: 38px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}
.utility-row>span {
  display: flex;
  align-items: center;
  gap: 6px;
}
.utility-links {
  display: flex;
  gap: 22px;
}
.utility-links button {
  background: none;
  border: 0;
  padding: 6px 0;
  font-size: 13px;
  color: #616858;
}
.header {
  position: sticky;
  top: 0;
  z-index: 30;
  background: #ffffffed;
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(18px);
  box-shadow: none;
}
.header-main {
  display: grid;
  grid-template-columns: auto auto minmax(120px,1fr) auto;
  align-items: center;
  gap: 28px;
  min-height: 104px;
}
.brand {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  border: 0;
  background: none;
  padding: 0;
  text-align: left;
  white-space: nowrap;
}
.brand-mark {
  display: grid;
  place-items: center;
  width: 48px;
  height: 50px;
  border-radius: 8px;
  background: var(--accent);
  color: var(--on-accent);
  font-size: 28px;
  font-weight: 650;
  font-style: normal;
  letter-spacing: -1px;
}
.brand-type {
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.brand-type strong {
  font-size: 20px;
  letter-spacing: -.035em;
  font-weight: 700;
}
.brand-type small {
  font-size: 12px;
  font-weight: 450;
  letter-spacing: 0;
  color: var(--muted);
}
.catalog-trigger {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 16px 24px;
  border: 0;
  background: var(--accent);
  color: var(--on-accent);
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  min-height: 54px;
}
.catalog-trigger:hover {
  background: var(--accent-dark);
}
.header-search {
  display: flex;
  align-items: center;
  border: 1px solid #dddfd4;
  border-radius: 8px;
  background: #f3f4f5;
  padding: 0 18px;
  gap: 8px;
  min-width: 0;
  transition: border-color .15s,background .15s;
}
.header-search:focus-within {
  border-color: var(--accent-ink);
  background: white;
  outline: 3px solid var(--focus);
  outline-offset: 3px;
}
.header-search input {
  width: 100%;
  min-width: 0;
  border: 0;
  background: transparent;
  padding: 17px 0;
  font-size: 16px;
  outline: none;
}
.header-search button {
  display: flex;
  background: none;
  border: 0;
  padding: 8px;
  color: var(--accent-ink);
}
.header-search .search-shortcut {
  font-size: 12px;
  color: #5f6658;
  border: 1px solid #dddfd6;
  border-radius: 4px;
  padding: 2px 5px;
  white-space: nowrap;
}
.header-icons {
  display: flex;
  align-items: center;
  gap: 17px;
}
.header-icons>button {
  display: flex;
  align-items: center;
  gap: 9px;
  position: relative;
  background: none;
  border: 0;
  padding: 9px 2px;
  font-size: 15px;
  font-weight: 650;
  min-height: 48px;
}
.cart-label {
  display: flex;
  flex-direction: column;
  gap: 3px;
  text-align: left;
}
.cart-label small {
  font-size: 12px;
  color: var(--muted);
  font-weight: 400;
}
.cart-count {
  position: absolute;
  top: 0;
  left: 18px;
  min-width: 21px;
  height: 21px;
  background: var(--danger);
  color: white;
  border: 2px solid white;
  border-radius: 10px;
  font-size: 11px;
  display: grid;
  place-items: center;
  padding: 0 2px;
}
.menu-trigger {
  display: none!important;
}
.store-category-nav {
  border-top: 1px solid #edece5;
}
.nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 22px;
  min-height: 62px;
  overflow-x: auto;
  scrollbar-width: none;
}
.nav button {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  white-space: nowrap;
  background: none;
  border: 0;
  padding: 18px 0;
  font-size: 15px;
  font-weight: 600;
  color: #555f4e;
  flex-shrink: 0;
}
.nav button:hover {
  color: var(--accent-ink);
}
.nav .nav-sale {
  color: var(--danger);
}
.nav .nav-sale span {
  display: grid;
  place-items: center;
  background: #f6e9e9;
  border-radius: 6px;
  width: 23px;
  height: 23px;
  font-size: 14px;
  font-weight: 800;
}
.mobile-menu {
  border-top: 1px solid var(--line);
  background: #fff;
  display: flex;
  flex-direction: column;
  max-height: 65vh;
  overflow-y: auto;
  padding-top: 10px;
  padding-bottom: 16px;
}
.mobile-menu button {
  border: 0;
  background: none;
  text-align: left;
  padding: 18px 4px;
  border-bottom: 1px solid var(--line);
  font-size: 16px;
}
.mobile-search-row {
  display: none;
}
/* Common controls */
.btn {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
  min-height: 54px;
  border: 1px solid var(--accent);
  border-radius: 8px;
  padding: 0 27px;
  background: var(--accent);
  color: var(--on-accent);
  font-size: 16px;
  font-weight: 600;
  transition: background .15s,transform .15s;
}
.btn:hover:not(:disabled) {
  background: var(--accent-dark);
  border-color: var(--accent-dark);
}
.btn-outline {
  background: transparent;
  color: var(--text);
  border-color: #aaa892;
}
.btn-outline:hover:not(:disabled) {
  color: var(--on-accent);
}
.btn-wide {
  width: 100%;
}
.btn-sm {
  min-height: 46px;
  padding: 0 18px;
  font-size: 14px;
}
.text-link {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  background: none;
  border: 0;
  padding: 4px 0;
  font-size: 15px;
  color: var(--accent-ink);
  font-weight: 650;
  min-height: 40px;
}
.text-link:hover {
  text-decoration: underline;
}
.section {
  padding: 54px 0;
}
.section-title,.value-section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 30px;
}
.section-title h2,.value-section-head h2 {
  margin: 0;
  font-size: 36px;
  line-height: 1.2;
  letter-spacing: -.03em;
  font-weight: 400;
  font-family: Georgia,'Times New Roman',serif;
}
.value-section-head button {
  border: 0;
  background: none;
  font-size: 15px;
  font-weight: 700;
  color: var(--accent-ink);
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 0;
  white-space: nowrap;
  min-height: 44px;
}
.section-number {
  font-size: 13px;
  color: #5f6658;
  font-weight: 600;
  letter-spacing: 0;
  margin-left: 10px;
  vertical-align: middle;
}
/* Homepage */
.value-home {
  padding-top: 32px;
  padding-bottom: 56px;
}
.value-hero {
  position: relative;
  display: grid;
  grid-template-columns: 1.05fr 1fr;
  min-height: 510px;
  border-radius: 14px;
  overflow: hidden;
  background: #f2f3f4;
  border: 1px solid #dcd7c7;
  padding: 0;
  box-shadow: none;
}
.hero-copy {
  align-self: center;
  position: relative;
  z-index: 2;
  padding: 52px 48px 54px;
}
.hero-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  letter-spacing: .1em;
  text-transform: uppercase;
  font-weight: 700;
  color: #666447;
}
.hero-eyebrow:before {
  content: '';
  width: 24px;
  height: 1px;
  background: #8d8164;
  border-radius: 0;
}
.hero-copy h1 {
  font-size: clamp(44px,4.8vw,68px);
  font-weight: 400;
  letter-spacing: -.03em;
  line-height: 1.06;
  margin: 24px 0 23px;
  max-width: 680px;
  font-family: Georgia,'Times New Roman',serif;
}
.hero-copy h1 span {
  color: #596448;
}
.hero-copy>p {
  font-size: 19px;
  line-height: 1.65;
  max-width: 425px;
  color: #65695d;
  margin: 0 0 32px;
}
.hero-actions {
  display: flex;
  gap: 20px;
  align-items: center;
  flex-wrap: wrap;
}
.hero-note {
  font-size: 14px;
  color: #5f6658;
}
.hero-art {
  position: relative;
  align-self: stretch;
  min-width: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  min-height: 440px;
  background: #e1ded3;
}
.hero-art:before {
  display: none;
}
.hero-art img {
  width: 100%;
  height: 100%;
  max-width: none;
  position: absolute;
  z-index: 1;
  object-fit: cover;
  filter: none;
  inset: 0;
  object-position: center;
}
.hero-sticker {
  display: none;
}
.hero-caption {
  position: absolute;
  right: 14px;
  bottom: 14px;
  font-size: 11px;
  color: #4e5547;
  z-index: 3;
  background: #ffffffe6;
  padding: 4px 8px;
  border-radius: 3px;
}
.home-perks {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  border-bottom: 1px solid var(--line);
  padding: 30px 24px;
  margin-bottom: 50px;
  gap: 28px;
  background: #f7f8f9;
  border: 1px solid var(--line);
  border-radius: 0 0 12px 12px;
  border-top: 0;
}
.home-perk {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
}
.home-perk>span {
  display: grid;
  place-items: center;
  width: 46px;
  height: 46px;
  border-radius: 8px;
  background: #eeeadd;
  color: var(--accent-ink);
  flex-shrink: 0;
}
.home-perk strong {
  display: block;
  font-size: 15px;
  font-weight: 650;
}
.home-perk small {
  display: block;
  font-size: 13px;
  margin-top: 4px;
  color: var(--muted);
  line-height: 1.5;
}
.value-section {
  margin-top: 56px;
}
.value-cats {
  display: grid;
  grid-template-columns: repeat(4,minmax(0,1fr));
  gap: 20px;
}
.value-cat {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  text-align: left;
  min-width: 0;
  min-height: 238px;
  border: 1px solid #dddfd6;
  background: #ebe6d8;
  border-radius: 12px;
  padding: 28px 24px;
  overflow: hidden;
  transition: border-color .2s,transform .2s;
  box-shadow: none;
}
.value-cat:nth-child(2) {
  background: #e9ede5;
  border-color: #dce2d7;
}
.value-cat:nth-child(3) {
  background: #eee6db;
  border-color: #e2d8c9;
}
.value-cat:nth-child(4) {
  background: #ede5e3;
  border-color: #e2d7d3;
}
.value-cat:hover {
  transform: translateY(-2px);
  border-color: #aaa48f;
}
.value-cat-name {
  font-size: 20px;
  line-height: 1.3;
  font-weight: 600;
  letter-spacing: -.02em;
  position: relative;
  z-index: 2;
  max-width: 205px;
  display: block;
}
.value-cat-count {
  display: block;
  font-size: 13px;
  color: #5f6658;
  margin-top: 12px;
  position: relative;
  z-index: 2;
  max-width: 140px;
}
.value-cat-arrow {
  position: absolute;
  bottom: 24px;
  left: 24px;
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  border-radius: 4px;
  background: transparent;
  z-index: 2;
  color: #57654e;
  border: 1px solid #b9b7a88c;
}
.value-cat-image {
  position: absolute;
  width: 145px;
  height: 160px;
  right: -8px;
  bottom: -10px;
  transform: rotate(-2deg);
}
.value-cat-image svg,.value-cat-image img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}
.value-cat-image svg>rect,.value-cat-image svg>ellipse,.value-cat-image svg>path,.value-cat-image svg>text {
  display: none;
}
.value-cat-image img {
  mix-blend-mode: multiply;
}
.value-cat-image svg[viewBox="0 0 24 24"] {
  padding: 20px;
  color: #8a9381;
}
.value-deals {
  margin-top: 56px;
}
.value-deals .value-section-head h2 {
  color: var(--text);
}
.value-badge {
  display: inline-flex;
  background: #f6e9e9;
  color: var(--danger);
  padding: 7px 11px;
  border-radius: 4px;
  font-size: 14px;
  letter-spacing: 0;
  margin-left: 8px;
  vertical-align: middle;
  font-family: Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
  font-weight: 600;
}
.deal-more {
  background: #000000;
  border: 1px solid #d5ceba;
  border-radius: 12px;
  padding: 32px;
  display: flex;
  align-items: flex-start;
  text-align: left;
  flex-direction: column;
  min-width: 0;
  overflow: hidden;
  position: relative;
  color: #414a37;
  border-color: #d6cdb8;
}
.deal-more .big-percent {
  font-size: 108px;
  font-weight: 400;
  letter-spacing: -.05em;
  line-height: 1;
  color: #a59a7d;
  margin: 4px 0 26px;
  font-family: Georgia,'Times New Roman',serif;
}
.deal-more strong {
  font-size: 30px;
  letter-spacing: -.025em;
  max-width: 210px;
  line-height: 1.2;
  font-family: Georgia,'Times New Roman',serif;
  font-weight: 400;
}
.deal-more .more-arrow {
  margin-top: auto;
  align-self: flex-end;
  background: #fff;
  border-radius: 4px;
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
}
.value-promo {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 32px;
  margin-top: 56px;
  padding: 40px 42px;
  border: 1px solid #d5ceba;
  background: #e9e6da;
  border-radius: 12px;
  border-color: #d9d3c0;
}
.value-promo-copy {
  display: flex;
  align-items: center;
  gap: 23px;
}
.value-promo-icon {
  display: grid;
  place-items: center;
  border-radius: 8px;
  background: #f7f5ed;
  width: 74px;
  height: 74px;
  color: var(--accent-ink);
  flex-shrink: 0;
  transform: none;
}
.value-promo h2 {
  font-size: 31px;
  letter-spacing: -.03em;
  margin: 0 0 7px;
  font-family: Georgia,'Times New Roman',serif;
  font-weight: 400;
}
.value-promo p {
  font-size: 16px;
  color: #6d6b5e;
  line-height: 1.6;
  margin: 0;
  max-width: 640px;
}
.value-features {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 32px;
  margin-top: 58px;
  padding-bottom: 15px;
  padding: 30px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #f7f8f9;
}
.value-feature {
  display: flex;
  gap: 17px;
  align-items: flex-start;
}
.value-feature i {
  font-style: normal;
  display: grid;
  place-items: center;
  width: 48px;
  height: 48px;
  flex-shrink: 0;
  color: #666447;
  background: #eeeadd;
  border-radius: 8px;
}
.value-feature strong {
  display: block;
  font-size: 16px;
}
.value-feature p {
  color: var(--muted);
  font-size: 14px;
  line-height: 1.7;
  margin: 6px 0 0;
}
/* Product tiles */
.product-grid {
  display: grid;
  grid-template-columns: repeat(4,minmax(0,1fr));
  gap: 24px;
}
.product-card {
  background: #fff;
  border: 1px solid #dddfd6;
  border-radius: 12px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  min-width: 0;
  transition: transform .2s,box-shadow .2s,border-color .2s;
  box-shadow: none;
}
.product-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px #2d34260c;
  border-color: #bdb9a8;
}
.product-visual {
  position: relative;
  border: 0;
  padding: 0;
  display: block;
  width: 100%;
  aspect-ratio: 1/1.08;
  background: #efefea;
  overflow: hidden;
}
.product-visual>svg,.product-visual>img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  transition: transform .35s;
}
.product-visual:hover>svg,.product-visual:hover>img {
  transform: scale(1.025);
}
.product-visual>svg>rect,.product-visual>svg>ellipse,.product-visual>svg>path,.product-visual>svg>text {
  display: none;
}
.product-visual>svg>g {
  transform: translateY(-8px);
}
.photo-note {
  position: absolute;
  bottom: 9px;
  right: 10px;
  font-size: 11px;
  color: #696f63;
  letter-spacing: .01em;
}
.pill {
  position: absolute;
  top: 16px;
  left: 16px;
  background: white;
  color: #566047;
  font-size: 13px;
  font-weight: 600;
  padding: 8px 10px;
  border-radius: 4px;
  z-index: 2;
  box-shadow: none;
}
.pill.sale {
  background: var(--danger);
  color: white;
}
.product-card-meta {
  padding: 23px 21px 21px;
  display: flex;
  flex-direction: column;
  flex: 1;
  align-items: stretch;
}
.product-prices {
  display: flex;
  align-items: baseline;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 8px;
}
.price {
  max-width: 100%;
  font-size: 30px;
  line-height: 1.1;
  font-weight: 650;
  letter-spacing: -.035em;
  white-space: nowrap;
}
.sale-price {
  color: var(--danger);
}
.old-price {
  font-size: 15px;
  text-decoration: line-through;
  color: #696f63;
  font-weight: 400;
  letter-spacing: 0;
  margin-left: 7px;
}
.product-prices .old-price {
  margin: 0;
}
.product-name {
  background: none;
  border: 0;
  padding: 0;
  text-align: left;
  font-size: 17px;
  line-height: 1.45;
  font-weight: 550;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  min-height: 50px;
}
.product-sub {
  font-size: 13px;
  color: #666d60;
  margin: 9px 0 12px;
}
.product-stock {
  font-size: 13px;
  color: #347354;
  display: flex;
  align-items: center;
  gap: 5px;
  margin-bottom: 15px;
}
.product-stock:before {
  content: '';
  width: 6px;
  height: 6px;
  background: #69a084;
  border-radius: 50%;
}
.product-stock.off {
  color: #6d7268;
}
.product-stock.off:before {
  background: #a7acb4;
}
.swatches {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 20px;
  margin: 0 0 12px;
  margin-bottom: 17px;
}
.swatch {
  width: 17px;
  height: 17px;
  border-radius: 50%;
  border: 1px solid #0001;
  box-shadow: 0 0 0 2px #fff;
}
.swatches .small {
  font-size: 13px;
  margin-left: 4px;
  color: #5f6658;
}
.quick-add {
  display: flex;
  padding-top: 0;
  margin-top: auto;
}
.quick-add button {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  width: 100%;
  min-height: 50px;
  background: var(--accent);
  border: 1px solid var(--accent);
  border-radius: 7px;
  padding: 12px 8px;
  color: var(--on-accent);
  font-size: 15px;
  font-weight: 600;
  border-color: var(--accent);
}
.quick-add button:hover:not(:disabled) {
  background: var(--accent-dark);
  border-color: var(--accent-dark);
  color: var(--on-accent);
}
/* Catalog and filters */
.breadcrumb {
  padding: 30px 0 24px;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 9px;
  font-size: 14px;
  color: #696f63;
  line-height: 1.5;
}
.breadcrumb button {
  background: none;
  border: 0;
  padding: 0;
  font-size: 14px;
  color: #696f63;
}
.breadcrumb button:hover {
  color: var(--accent-ink);
}
.page-heading {
  font-size: 44px;
  line-height: 1.12;
  margin: 8px 0 16px;
  letter-spacing: -.03em;
  font-family: Georgia,'Times New Roman',serif;
  font-weight: 400;
}
.page-intro {
  color: var(--muted);
  font-size: 17px;
  line-height: 1.7;
  max-width: 850px;
  margin: 0;
}
.categories-bar {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  padding: 28px 0 32px;
}
.category-chip {
  border: 1px solid var(--line);
  border-radius: 12px;
  background: white;
  padding: 13px 18px;
  font-size: 15px;
  min-height: 48px;
}
.category-chip:hover,.category-chip.active {
  border-color: #a79b7c;
  color: var(--accent-ink);
  background: var(--warm);
}
.catalog-wrap {
  display: grid;
  grid-template-columns: 266px minmax(0,1fr);
  gap: 30px;
  padding-bottom: 80px;
  align-items: start;
}
.sidebar {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 25px 20px;
  box-shadow: 0 8px 24px #2d342604;
}
.filter-title {
  font-size: 18px;
  font-weight: 750;
  margin-bottom: 18px;
}
.category-tree,.category-tree ul {
  list-style: none;
  margin: 0 0 20px;
  padding: 0;
}
.category-tree ul {
  padding-left: 11px;
  margin: 0;
  border-left: 1px solid var(--line);
}
.category-node {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  width: 100%;
  text-align: left;
  background: none;
  border: 0;
  border-radius: 7px;
  padding: 10px 9px;
  font-size: 14px;
  line-height: 1.45;
}
.category-node span {
  font-size: 12px;
  color: #5f6658;
}
.category-node:hover,.category-node.active {
  background: #eceef0;
  color: var(--accent-ink);
}
.category-node.active {
  font-weight: 650;
}
.filter-block {
  border-top: 1px solid #edece5;
  padding: 23px 0;
}
.filter-block h3 {
  font-size: 15px;
  font-weight: 650;
  margin: 0 0 14px;
  margin-bottom: 17px;
}
.filter-row {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 14px;
  line-height: 1.55;
  margin: 13px 0;
  color: #6d7268;
  cursor: pointer;
  overflow-wrap: anywhere;
}
.filter-row input {
  width: 19px;
  height: 19px;
  flex-shrink: 0;
  accent-color: var(--accent-ink);
}
.filter-swatches {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.filter-swatch {
  width: 36px;
  height: 36px;
  border: 1px solid #dddfd6;
  background: none;
  padding: 4px;
  display: grid;
  place-items: center;
  border-radius: 50%;
}
.filter-swatch.active {
  border: 2px solid var(--accent);
  padding: 3px;
}
.filter-swatch span {
  display: block;
  width: 23px;
  height: 23px;
  border-radius: 50%;
  border: 1px solid #0001;
}
.price-fields {
  display: flex;
  gap: 8px;
}
.price-fields label {
  font-size: 13px;
  color: var(--muted);
  flex: 1;
  min-width: 0;
}
.price-fields input {
  display: block;
  width: 100%;
  min-width: 0;
  border: 1px solid var(--line);
  border-radius: 7px;
  margin-top: 6px;
  padding: 12px 10px;
  font-size: 16px;
  color: var(--text);
  min-height: 46px;
}
.sidebar .small {
  font-size: 12px;
  line-height: 1.6;
}
.sidebar .text-link {
  font-size: 14px;
}
.catalog-results {
  min-width: 0;
}
.catalog-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  flex-wrap: wrap;
  margin-bottom: 24px;
  scroll-margin-top: 190px;
}
.catalog-toolbar>.muted {
  font-size: 14px;
  margin-right: auto;
}
.catalog-toolbar label {
  font-size: 13px;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 6px;
}
.sort-select {
  border: 1px solid var(--line);
  border-radius: 11px;
  background: #fff;
  padding: 12px;
  font-size: 14px;
  color: #666d60;
  min-height: 46px;
  max-width: 100%;
}
.filter-toggle {
  display: none;
}
.selected-filters {
  display: flex;
  align-items: center;
  gap: 7px;
  flex-wrap: wrap;
  margin-bottom: 18px;
}
.selected-filter {
  display: flex;
  align-items: center;
  gap: 7px;
  border: 1px solid #c9c5b6;
  background: #eceef0;
  color: #566047;
  border-radius: 7px;
  padding: 11px 13px;
  font-size: 14px;
  max-width: 100%;
  overflow-wrap: anywhere;
  text-align: left;
}
.selected-filter svg {
  flex-shrink: 0;
}
.pagination {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 9px;
  margin-top: 38px;
}
.pagination button {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 9px;
  min-width: 46px;
  min-height: 48px;
  font-size: 15px;
}
.pagination [aria-current=page] {
  background: var(--accent);
  border-color: var(--accent-ink);
  color: var(--on-accent);
}
.empty {
  grid-column: 1/-1;
  text-align: center;
  padding: 65px 24px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 16px;
}
.empty h3 {
  font-size: 26px;
  margin: 0 0 10px;
}
.empty p {
  font-size: 16px;
  color: var(--muted);
  line-height: 1.7;
  margin-bottom: 23px;
}
/* Product detail */
.detail {
  display: grid;
  grid-template-columns: 1.03fr .97fr;
  gap: 64px;
  padding: 6px 0 65px;
  align-items: start;
  padding-bottom: 80px;
}
.detail-main-img {
  background: #eeeee7;
  border: 1px solid #dddfd6;
  border-radius: 26px;
  aspect-ratio: 1/1.05;
  overflow: hidden;
}
.detail-main-img>svg,.detail-main-img>img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}
.gallery-thumbs {
  display: flex;
  gap: 9px;
  flex-wrap: wrap;
  margin-top: 12px;
}
.thumb {
  width: 88px;
  height: 94px;
  border: 1px solid #dddfd6;
  border-radius: 13px;
  background: #eeeee7;
  padding: 3px;
  overflow: hidden;
}
.thumb.active {
  border-color: var(--accent-ink);
  box-shadow: 0 0 0 1px var(--accent);
}
.thumb>svg,.thumb>img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}
.detail-info {
  min-width: 0;
  padding-top: 11px;
}
.detail-info h1 {
  font-size: clamp(34px,3.3vw,48px);
  letter-spacing: -.03em;
  line-height: 1.15;
  margin: 16px 0 28px;
  font-family: Georgia,'Times New Roman',serif;
  font-weight: 400;
}
.detail-price {
  font-size: 42px;
  font-weight: 650;
  letter-spacing: -.035em;
  color: var(--text);
  margin-bottom: 32px;
}
.detail-price .old-price {
  font-size: 20px;
}
.product-options {
  border: 0;
  margin: 0;
  padding: 0;
  min-width: 0;
}
.product-options legend,.detail-label {
  font-size: 16px;
  font-weight: 650;
  padding: 0;
}
.variant-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin: 11px 0 24px;
}
.variant-pill {
  display: flex;
  align-items: center;
  gap: 7px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: #fff;
  padding: 12px 16px;
  font-size: 15px;
  min-height: 48px;
}
.variant-pill.active {
  border-color: var(--accent-ink);
  background: #eceef0;
  color: #566047;
  box-shadow: 0 0 0 1px #313a3026;
}
.variant-pill:disabled {
  text-decoration: line-through;
  opacity: .48;
}
.variant-dot {
  width: 15px;
  height: 15px;
  border-radius: 50%;
  border: 1px solid #0001;
  flex-shrink: 0;
}
.stock-info {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 15px;
  color: #347354;
  margin: 15px 0 20px;
  line-height: 1.6;
  flex-wrap: wrap;
}
.stock-info.off {
  color: #8d6468;
}
.stock-dot {
  width: 5px;
  height: 5px;
  background: currentColor;
  border-radius: 50%;
}
.buy-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.buy-row>.btn {
  flex: 1;
  min-width: 175px;
}
.qty-input {
  display: flex;
  align-items: center;
  justify-content: space-between;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: #fff;
  height: 54px;
  width: 138px;
  flex-shrink: 0;
  overflow: hidden;
}
.qty-input button {
  height: 100%;
  background: none;
  border: 0;
  padding: 0 15px;
  display: flex;
  align-items: center;
}
.qty-input strong {
  font-size: 16px;
}
.detail-rule {
  border-top: 1px solid var(--line);
  padding: 27px 0;
}
.detail-rule>strong {
  font-size: 17px;
  font-weight: 650;
}
.detail-rule p {
  font-size: 16px;
  line-height: 1.8;
  color: var(--muted);
  margin: 10px 0 0;
}
.desc {
  white-space: pre-line;
}
.detail-attrs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
  margin: 16px 0 0;
  font-size: 16px;
  line-height: 1.5;
}
.detail-attrs dt {
  color: #696d63;
  font-size: 14px;
}
.detail-attrs dd {
  margin: 4px 0 0;
  font-weight: 550;
  overflow-wrap: anywhere;
}
/* Basket and checkout */
.cart-layout,.checkout-grid {
  display: grid;
  grid-template-columns: minmax(0,1fr) 390px;
  gap: 42px;
  padding: 12px 0 80px;
  align-items: start;
}
.cart-item {
  display: grid;
  grid-template-columns: 120px minmax(0,1fr) auto;
  gap: 24px;
  padding: 30px 0;
  border-bottom: 1px solid var(--line);
  align-items: start;
}
.cart-img {
  width: 120px;
  height: 144px;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 17px;
  background: #eeeee7;
  padding: 0;
}
.cart-img>svg,.cart-img>img {
  height: 100%;
  width: 100%;
  object-fit: contain;
}
.cart-item h3 {
  margin: 3px 0 7px;
  font-size: 18px;
  font-weight: 600;
  line-height: 1.4;
}
.cart-item p {
  font-size: 14px;
  color: var(--muted);
  margin: 6px 0;
  line-height: 1.5;
}
.cart-line-price {
  font-size: 18px;
  white-space: nowrap;
}
.cart-item-controls {
  display: flex;
  align-items: center;
  gap: 22px;
  margin-top: 15px;
}
.cart-item .qty-input {
  height: 44px;
  width: 120px;
}
.remove {
  border: 0;
  background: none;
  padding: 5px 0;
  font-size: 14px;
  color: #696f63;
  text-decoration: underline;
  min-height: 36px;
}
.summary {
  background: #fff;
  border: 1px solid #dddfd6;
  border-radius: 12px;
  padding: 30px;
  height: max-content;
  box-shadow: var(--shadow);
}
.summary h3 {
  font-size: 26px;
  letter-spacing: -.03em;
  margin: 0 0 18px;
  font-weight: 700;
}
.summary-line {
  display: flex;
  justify-content: space-between;
  gap: 15px;
  padding: 12px 0;
  font-size: 16px;
  line-height: 1.6;
}
.summary-line>span:first-child {
  min-width: 0;
}
.summary-line strong,.summary-line b {
  white-space: nowrap;
  font-weight: 650;
}
.summary-line.total {
  border-top: 1px solid var(--line);
  margin-top: 12px;
  padding-top: 18px;
  font-size: 23px;
  font-weight: 750;
}
.summary-note {
  font-size: 13px;
  line-height: 1.75;
  color: #696f63;
  margin: 16px 0 0;
}
.continue {
  background: none;
  border: 0;
  text-decoration: underline;
  color: var(--muted);
  font-size: 15px;
  padding: 0;
  margin-top: 25px;
}
.checkout-grid {
  padding-top: 30px;
  gap: 48px;
}
.checkout-fields {
  border: 0;
  margin: 0;
  padding: 0;
  min-width: 0;
}
.form-section {
  border-bottom: 1px solid var(--line);
  margin-bottom: 28px;
  padding-bottom: 22px;
}
.form-section h2 {
  font-size: 24px;
  letter-spacing: -.02em;
  margin: 0 0 20px;
}
.fields {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}
.field {
  display: flex;
  flex-direction: column;
  gap: 10px;
  font-size: 15px;
  color: var(--muted);
  margin-bottom: 20px;
  min-width: 0;
}
.field input,.field textarea {
  width: 100%;
  padding: 15px;
  border: 1px solid #dadcd2;
  border-radius: 12px;
  background: #fff;
  color: var(--text);
  font-size: 17px;
  min-height: 52px;
  resize: vertical;
}
.field input:focus,.field textarea:focus {
  border-color: var(--accent-ink);
}
.choice {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  border: 1px solid var(--line);
  background: #fff;
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 9px;
  font-size: 16px;
  cursor: pointer;
}
.choice.selected {
  border-color: #a79b7c;
  background: #f1eee3;
}
.choice input {
  accent-color: var(--accent-ink);
  margin: 2px 0 0;
  width: 19px;
  height: 19px;
}
.choice span {
  flex: 1;
}
.choice small {
  display: block;
  color: var(--muted);
  font-size: 14px;
  line-height: 1.7;
  margin-top: 5px;
}
.choice b {
  font-size: 15px;
  white-space: nowrap;
}
.terms {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  font-size: 14px;
  line-height: 1.7;
  color: #5f6658;
  margin-bottom: 18px;
}
.terms input {
  accent-color: var(--accent-ink);
  margin: 4px 0 0;
  flex-shrink: 0;
  width: 19px;
  height: 19px;
}
.error {
  background: #f6e9e9;
  border: 1px solid #ecd9db;
  border-radius: 9px;
  color: #984a52;
  padding: 13px;
  font-size: 15px;
  line-height: 1.7;
  margin: 15px 0;
}
.success-page {
  max-width: 660px;
  margin: auto;
  padding: 85px 24px 95px;
  text-align: center;
}
.success-icon {
  display: grid;
  place-items: center;
  width: 65px;
  height: 65px;
  border-radius: 12px;
  background: #ebe6d8;
  color: var(--accent-ink);
  margin: 0 auto 18px;
}
.success-page h1 {
  font-size: 44px;
  line-height: 1.15;
  margin: 19px 0;
  font-family: Georgia,'Times New Roman',serif;
  font-weight: 400;
  letter-spacing: -.03em;
}
.success-page p {
  font-size: 17px;
  color: var(--muted);
  line-height: 1.8;
}
.success-page strong {
  overflow-wrap: anywhere;
}
.info-page {
  max-width: 880px;
  margin: 0 auto;
  padding: 18px 0 85px;
}
.info-page h1 {
  font-size: 46px;
  margin: 0 0 27px;
  font-family: Georgia,'Times New Roman',serif;
  font-weight: 400;
  letter-spacing: -.03em;
}
.info-page h2 {
  font-size: 25px;
  margin: 30px 0 12px;
  font-family: Georgia,'Times New Roman',serif;
  font-weight: 400;
  letter-spacing: -.03em;
}
.info-page p {
  font-size: 17px;
  line-height: 1.8;
  color: var(--muted);
}
.debug-info {
  padding: 18px;
  border: 1px solid var(--line);
  border-radius: 12px;
  font-size: 15px;
  line-height: 1.8;
  color: var(--muted);
  background: white;
}
.toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 100;
  display: flex;
  align-items: center;
  gap: 10px;
  background: #313a30;
  color: #fff;
  border-radius: 13px;
  padding: 20px 24px;
  box-shadow: 0 8px 32px #272c2524;
  font-size: 15px;
  max-width: 420px;
}
/* Footer */
.footer {
  background: #000000;
  border-top: 1px solid #dddfd6;
  padding: 58px 0 30px;
  color: #5e6656;
  border-color: #d6d3c4;
}
.footer-grid {
  display: grid;
  grid-template-columns: 1.5fr 1fr 1fr;
  gap: 60px;
  margin-bottom: 45px;
}
.footer .brand {
  margin-bottom: 15px;
  color: var(--text);
}
.footer p {
  font-size: 14px;
  line-height: 1.8;
  color: #5f6658;
  max-width: 380px;
}
.footer h4 {
  font-size: 17px;
  margin: 0 0 19px;
  font-weight: 650;
  color: #4f5947;
  margin-bottom: 23px;
}
.footer button:not(.brand) {
  display: block;
  border: 0;
  background: none;
  padding: 0;
  margin: 0 0 13px;
  font-size: 15px;
  text-align: left;
  color: #5f6658;
  margin-bottom: 16px;
}
.footer button:hover {
  color: var(--accent-ink);
}
.footer-bottom {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  border-top: 1px solid #dbddd2;
  padding-top: 25px;
  font-size: 13px;
  color: #5f6658;
  line-height: 1.6;
}
.catalog-results .product-grid {
  grid-template-columns: repeat(3,minmax(0,1fr));
}
@media(min-width:851px) {
  .sidebar {
    position: sticky;
    top: 190px;
    max-height: calc(100vh - 214px);
    overflow: auto;
  }
  .summary {
    position: sticky;
    top: 190px;
  }
}
@media(max-width:1100px) {
  .header-main {
    gap: 18px;
  }
  .header-main .brand-type strong {
    font-size: 18px;
  }
  .catalog-trigger {
    padding: 14px 18px;
    border-radius: 8px;
    font-weight: 600;
  }
  .hero-copy h1 {
    font-size: 56px;
  }
  .value-hero {
    padding: 0;
    min-height: 450px;
  }
  .hero-copy {
    padding: 42px 34px;
  }
  .value-cat {
    padding: 24px 20px;
    min-height: 230px;
  }
  .value-cat-name {
    font-size: 18px;
    max-width: 180px;
  }
  .value-cat-image {
    width: 120px;

  Object.entries(p.attrs).forEach(([key,value])=>{if(!options.has(key))options.set(key,new Set());options.get(key).add(value)});
  p.variants.forEach(v=>Object.entries(v.options).filter(([key])=>key!=='Цвет').forEach(([key,value])=>{if(!options.has(key))options.set(key,new Set());options.get(key).add(value)}));
 });
 return [...options].map(([key,values])=>({key,values:[...values].sort((a,b)=>a.localeCompare(b,'ru'))}));
}
function priceBounds(){const prices=scopedProducts().flatMap(p=>p.variants.map(v=>skuPrice(p,v)));return {min:prices.length?Math.floor(Math.min(...prices)):0,max:prices.length?Math.ceil(Math.max(...prices)):0}}
function matchingVariants(p){return p.variants.filter(v=>
 (!(state.collection==='sale'||state.onlySale)||skuOld(p,v)>skuPrice(p,v))&&
 (!state.onlyStock||v.stock>0)&&(!state.filterColor||v.options.Цвет===state.filterColor)&&
 (state.minPrice===null||skuPrice(p,v)>=state.minPrice)&&(state.maxPrice===null||skuPrice(p,v)<=state.maxPrice)&&
 Object.entries(state.attributes).every(([key,values])=>values.includes(v.options[key]??p.attrs[key]))
)}
const matchingPrice=p=>Math.min(...matchingVariants(p).map(v=>skuPrice(p,v)));
function catalogProducts(){
 let ps=scopedProducts();
 if(state.collection==='new')ps=ps.filter(p=>p.tag==='Новинка');
 if(state.query){const words=normalize(state.query).trim().split(/\s+/);ps=ps.filter(p=>{const text=normalize([p.name,p.summary,p.id,...categoryPath(p.cat).map(c=>c.name),...Object.values(p.attrs),...p.variants.map(v=>v.sku)].join(' '));return words.every(w=>text.includes(w))})}
 ps=ps.filter(p=>matchingVariants(p).length);
 return ps.sort((a,b)=>(state.sort==='price-asc'?matchingPrice(a)-matchingPrice(b):state.sort==='price-desc'?matchingPrice(b)-matchingPrice(a):state.sort==='new'?b.date-a.date:b.pop-a.pop)||a.id.localeCompare(b.id));
}

 state.orderAttempt=null;writeSession('store-order-attempt',null);
 state.cart=[];saveCart();state.fields={name:'',phone:'',email:'',city:'',address:'',note:''};state.agree=false;nav('confirmed');
 try{await refreshCart()}catch{}
}
async function refreshCart(){
 const response=await fetch('/api/catalog',{cache:'no-store',signal:AbortSignal.timeout(10000)});if(!response.ok)throw new Error('Не удалось обновить корзину. Обновите страницу.');
 const data=await response.json();products.splice(0,products.length,...data.products);if(data.checkout)Object.assign(checkoutConfig,data.checkout);
 state.cart=state.cart.flatMap(item=>{const v=itemVariant(item);return v&&v.stock>0?[{...item,qty:Math.min(v.stock,item.qty)}]:[]});saveCart();
}
async function sendOrder(){
 if(state.submitting||!orderingEnabled)return;
 const f=state.fields;
 if(!f.name.trim()||f.phone.replace(/\D/g,'').length<7||!f.city.trim()||(state.delivery!=='pickup'&&!f.address.trim())){state.error='Заполните имя, телефон, город и адрес доставки (если требуется).';render();return}
 if(!state.agree){state.error='Подтвердите согласие на обработку данных для оформления заказа.';render();return}
 const payload={customer:{...f},delivery:state.delivery,payment:'manual',consent:true,shippingCents:Math.round(shipping()*100),items:state.cart.map(item=>({id:item.id,sku:item.sku,qty:item.qty,priceCents:Math.round(unitPrice(item)*100)}))};
 state.submitting=true;state.error='';render();let responded=false;
 try{
  const digest=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(JSON.stringify(payload))))).map(n=>n.toString(16).padStart(2,'0')).join('');
  const attempt=state.orderAttempt?.digest===digest?state.orderAttempt:{key:crypto.randomUUID(),digest};state.orderAttempt={...attempt,pending:true};writeSession('store-order-attempt',state.orderAttempt);
  const response=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json','Idempotency-Key':attempt.key},body:JSON.stringify(payload),signal:AbortSignal.timeout(15000)});
  const data=await response.json();responded=true;
  if(!response.ok){state.orderAttempt.pending=false;writeSession('store-order-attempt',state.orderAttempt);if(data.code==='CART_CHANGED'){await refreshCart();state.page='cart';writeLocation();}throw new Error(data.message||'Не удалось оформить заказ.');}
  await acceptReceipt(data,attempt.key);
 }catch(error){state.error=responded?error.message:'Подтверждение не получено. Повторите отправку: повторный заказ не создастся.';}finally{state.submitting=false;render()}
}
async function recoverReceipt(){
 const pending=state.orderAttempt?.pending,last=readSession('store-last-order'),key=pending?state.orderAttempt.key:state.page==='confirmed'?last?.key:null;
 if(!orderingEnabled||!key)return;
 try{const response=await fetch('/api/orders/receipt',{headers:{'Idempotency-Key':key},cache:'no-store',signal:AbortSignal.timeout(10000)});if(response.ok){const receipt=await response.json();if(pending)await acceptReceipt(receipt,key);else if(validReceipt(receipt)){state.receipt=receipt;writeSession('store-last-order',{key,receipt});render()}}}catch{}
}
function renderInfo(){const info={delivery:['Доставка и оплата',[['Варианты доставки','Предусмотрены курьерская, почтовая доставка и самовывоз. Реальные службы доставки, сроки и тарифы будут настроены позднее.'],['Оплата','Способ оплаты согласуется с продавцом при подтверждении заказа. Онлайн-оплата пока не подключена.'],['Важно','В заказе указан предварительный тариф магазина. Служба, сроки и условия доставки подтверждаются продавцом вручную.']]],returns:['Возврат и обмен',[['Условия возврата','На рабочем сайте здесь будет опубликована политика возврата с учётом законодательства Беларуси и характеристик товарных категорий.'],['Оформление обращения','Будут доступны контактные данные продавца и информация о процедуре возврата.']]],contacts:['Контакты',[['Связь с магазином','Здесь будут юридические сведения, телефон, электронная почта и социальные сети.'],['Адрес','Заменим после утверждения фактических данных продавца.']]]};let obj=info[state.info]||info.delivery;return `<main class="container">${crumb([{name:obj[0]}])}<div class="info-page"><h1 class="serif">${obj[0]}</h1>${obj[1].map(row=>`<h2>${row[0]}</h2><p>${row[1]}</p>`).join('')}<div class="debug-info" style="margin-top:40px">Это шаблон информационной страницы. Перед запуском нужно заполнить реальные юридические и контактные сведения, условия продажи и обязательные документы.</div></div></main>`}
function render(){const contents=state.page==='home'?renderHome():state.page==='catalog'?renderCatalog():state.page==='product'?renderProduct():state.page==='cart'?renderCart():state.page==='checkout'?renderCheckout():state.page==='confirmed'?renderConfirmed():renderInfo();$('#app').innerHTML=header()+contents+footer()+(state.toast?`<div class="toast" role="status">${I('check',17)}${esc(state.toast)}</div>`:'');}
function nav(page){state.page=page;state.menuOpen=false;state.mobileSearch=false;state.error='';state.toast='';state.filtersOpen=false;window.scrollTo({top:0,behavior:'instant'});render();writeLocation()}
function resetFilters(){Object.assign(state,{minPrice:null,maxPrice:null,onlyStock:false,onlySale:false,filterColor:'',attributes:{},query:'',collection:'',sort:'popular',catalogPage:1})}
function updateCatalog(resetPage=true){if(resetPage)state.catalogPage=1;render();writeLocation()}
function selectCategory(id){state.cat=category(id).id;state.attributes={};state.filterColor='';state.minPrice=null;state.maxPrice=null;state.catalogPage=1;nav('catalog')}
function writeLocation(replace=false){
 const url=new URL(location.href);url.search='';const q=url.searchParams;
 if(state.page!=='home')q.set('view',state.page);
 if(state.cat!=='all')q.set('cat',state.cat);
 if(state.query)q.set('q',state.query);
 if(state.collection)q.set('collection',state.collection);
 if(state.sort!=='popular')q.set('sort',state.sort);
 for(const [key,param] of [['minPrice','min'],['maxPrice','max']])if(state[key]!==null)q.set(param,state[key]);
 if(state.onlyStock)q.set('stock','1');if(state.onlySale)q.set('sale','1');
 if(state.filterColor)q.set('color',state.filterColor);
 for(const key of Object.keys(state.attributes).sort())for(const value of [...state.attributes[key]].sort())q.append('attr.'+key,value);
 if(state.catalogPage>1)q.set('page',state.catalogPage);
 if(state.pageSize!==12)q.set('size',state.pageSize);
 if(state.page==='product'){q.set('product',state.productId);const v=selectedVariant(find(state.productId));if(v)q.set('sku',v.sku)}
 if(state.page==='info')q.set('info',state.info||'delivery');
 if(state.page==='home'&&q.size)q.set('view','home');
 if(url.href!==location.href)history[replace?'replaceState':'pushState'](null,'',url);
}
function readLocation(){
 resetFilters();state.cat='all';state.pageSize=12;state.filtersOpen=false;state.menuOpen=false;state.mobileSearch=false;
 const q=new URL(location.href).searchParams;
 state.page=['home','catalog','product','cart','checkout','confirmed','info'].includes(q.get('view'))?q.get('view'):(q.size?'catalog':'home');
 if(state.page==='confirmed'&&!state.receipt)state.page='cart';
 state.cat=category(q.get('cat')).id;state.query=(q.get('q')||'').trim();
 if(['sale','new'].includes(q.get('collection')))state.collection=q.get('collection');
 if(['popular','new','price-asc','price-desc'].includes(q.get('sort')))state.sort=q.get('sort');
 for(const [key,param] of [['minPrice','min'],['maxPrice','max']]){const raw=q.get(param),n=Number(raw);if(raw!==null&&raw.trim()!==''&&Number.isFinite(n)&&n>=0)state[key]=n}
 state.onlyStock=q.get('stock')==='1';state.onlySale=q.get('sale')==='1';
 if(availableColors().some(c=>c.name===q.get('color')))state.filterColor=q.get('color');
 if(state.cat!=='all')for(const {key,values} of attributeOptions()){const selected=[...new Set(q.getAll('attr.'+key))].filter(v=>values.includes(v));if(selected.length)state.attributes[key]=selected}
 const page=Number(q.get('page'));if(Number.isSafeInteger(page)&&page>0)state.catalogPage=page;
 const size=Number(q.get('size'));if([12,36,48].includes(size))state.pageSize=size;
 if(state.page==='product'){const p=find(q.get('product'));if(p){state.productId=p.id;const idx=p.variants.findIndex(v=>v.sku===q.get('sku'));chooseVariant(p,idx>=0?idx:Math.max(0,p.variants.findIndex(v=>v.stock>0)))}else state.page='catalog'}
 if(state.page==='info')state.info=['delivery','returns','contacts'].includes(q.get('info'))?q.get('info'):'delivery';
 catalogWindow();
}
window.addEventListener('popstate',()=>{readLocation();render();writeLocation(true)});
function addToCart(id,variantIndex,qty){
 const p=find(id),v=p?.variants[variantIndex];
 if(!v||!Number.isSafeInteger(qty)||qty<=0)return;
 const old=state.cart.find(x=>x.id===id&&x.sku===v.sku);
 if(qty>remaining(p,v)){withToast('Доступного количества недостаточно');return}
 if(old)old.qty+=qty;else state.cart.push({id,sku:v.sku,qty});
 if(state.page==='product')state.qty=Math.min(state.qty,Math.max(1,remaining(p,v)));
 saveCart();withToast('Товар добавлен в корзину');
}
let toastTimer;function withToast(msg){state.toast=msg;render();clearTimeout(toastTimer);toastTimer=setTimeout(()=>{state.toast='';render()},2600)}
document.addEventListener('click',e=>{if(state.submitting)return;let t=e.target.closest('button');if(!t)return;const d=t.dataset;
 if(d.action==='menu'){state.menuOpen=!state.menuOpen;state.mobileSearch=false;render();return}
 if(d.action==='mobileSearch'){state.mobileSearch=!state.mobileSearch;state.menuOpen=false;render();return}
 if(d.collection){resetFilters();state.collection=d.collection;state.cat='all';nav('catalog');return}
 if(d.info){state.info=d.info;nav('info');return}
 if(d.go){if(d.cat!==undefined){resetFilters();state.cat=d.cat}nav(d.go);return}
 if(d.product){state.productId=d.product;const p=find(d.product);const matches=state.page==='catalog'?matchingVariants(p):p.variants;const v=p.variants.find(v=>v.sku===d.sku)||matches.find(v=>v.stock>0)||matches[0]||p.variants[0];chooseVariant(p,p.variants.indexOf(v));nav('product');return}
 if(d.action==='filters'){state.filtersOpen=!state.filtersOpen;render();document.querySelector(state.filtersOpen?'.filters-close':'.catalog-toolbar .filter-toggle')?.focus();return}
 if(d.category){selectCategory(d.category);return}
 if(d.catalogPage){state.catalogPage=Number(d.catalogPage);updateCatalog(false);document.querySelector('.catalog-toolbar')?.scrollIntoView({block:'start'});return}
 if(d.removeFilter){const key=d.removeFilter;if(key==='attribute'){const [attr,value]=JSON.parse(d.value);state.attributes[attr]=state.attributes[attr].filter(v=>v!==value);if(!state.attributes[attr].length)delete state.attributes[attr]}else state[key]=key==='minPrice'||key==='maxPrice'?null:key==='onlyStock'||key==='onlySale'?false:'';updateCatalog();return}
 if(d.action==='resetFilters'){resetFilters();updateCatalog();return}
 if(d.filterColor!==undefined){state.filterColor=state.filterColor===d.filterColor?'':d.filterColor;updateCatalog();return}
 if(d.option){state.selectedOptions[d.option]=d.value;const p=find(state.productId),v=selectedVariant(p);if(v)chooseVariant(p,p.variants.indexOf(v));render();writeLocation();document.querySelector(`[data-option="${CSS.escape(d.option)}"][data-value="${CSS.escape(d.value)}"]`)?.focus();return}
 if(d.gallery!==undefined){state.gallery=Number(d.gallery);render();return}
 if(d.qty!==undefined){const p=find(state.productId),v=selectedVariant(p),max=v?remaining(p,v):0;state.qty=Math.min(max||1,Math.max(1,state.qty+Number(d.qty)));render();return}
 if(d.add){addToCart(d.add,Number(d.variantIndex||0),Number(d.qtyAdd||1));return}
 if(d.cartRemove!==undefined){state.cart.splice(Number(d.cartRemove),1);saveCart();render();return}
 if(d.cartQty){let [idx,step]=d.cartQty.split(':').map(Number);let item=state.cart[idx];if(!item)return;let max=itemVariant(item).stock;item.qty=Math.min(max,Math.max(0,item.qty+step));if(item.qty===0)state.cart.splice(idx,1);saveCart();render();return}
});
document.addEventListener('input',e=>{if(e.target.dataset.field)state.fields[e.target.dataset.field]=e.target.value});
document.addEventListener('change',e=>{const d=e.target.dataset;
 if(d.sort!==undefined){state.sort=e.target.value;updateCatalog();return}
 if(d.pageSize!==undefined){state.pageSize=Number(e.target.value);updateCatalog();return}
 if(d.price){const raw=e.target.value,n=Number(raw);state[d.price]=raw!==''&&Number.isFinite(n)&&n>=0?n:null;updateCatalog();return}
 if(d.attribute){const values=new Set(state.attributes[d.attribute]||[]);if(e.target.checked)values.add(e.target.value);else values.delete(e.target.value);if(values.size)state.attributes[d.attribute]=[...values];else delete state.attributes[d.attribute];updateCatalog();return}
 if(d.filter==='onlyStock'||d.filter==='onlySale'){state[d.filter]=e.target.checked;updateCatalog();return}
 if(e.target.name==='delivery'){state.delivery=e.target.value;render();return}if(e.target.name==='payment'){state.payment=e.target.value;render();return}if(e.target.id==='agree'){state.agree=e.target.checked;return}
});
document.addEventListener('submit',e=>{if(e.target.matches('[data-search]')){e.preventDefault();const q=e.target.querySelector('input[name="query"]')?.value||'';resetFilters();state.query=q.trim();state.cat='all';nav('catalog');return}if(e.target.id==='checkout-form'){e.preventDefault();sendOrder();return}});
readLocation();
render();
writeLocation(true);
recoverReceipt();
})();
</script>
</body>
</html>
