name: Сверить 5 черновиков Emall

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-drafts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Установить зависимости
        run: npm ci --no-audit --no-fund
      - name: Проверить чтение и сверку
        run: node --test tests/emall-client.test.mjs tests/review-emall.test.mjs
      - name: Сверить только пять сохранённых карточек
        env:
          EMALL_API_TOKEN: ${{ secrets.EMALL_API_TOKEN }}
        run: node scripts/review-emall-drafts.mjs
      - name: Сохранить отчёт сверки
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: emall-review
          path: var/emall-review/review.json
          if-no-files-found: error
          retention-days: 7
