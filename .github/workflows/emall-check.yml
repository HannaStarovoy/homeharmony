name: Проверить Emall API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-catalog:
    name: Чтение первых пяти товаров
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Получить код магазина
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node.js 24
        with:
          persist-credentials: false

      - name: Подготовить Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, Node.js 24
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Проверить клиент на искусственных данных
        run: node --test tests/emall-client.test.mjs tests/emall-cli.test.mjs

      - name: Проверить чтение каталога Emall
        env:
          EMALL_API_TOKEN: ${{ secrets.EMALL_API_TOKEN }}
        run: node scripts/check-emall.mjs --summary
