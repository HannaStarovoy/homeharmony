name: Массовый импорт Emall

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-drafts:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Установить зависимости
        run: npm ci --no-audit --no-fund
      - name: Проверить импорт на тестовых данных
        run: npm test
      - name: Получить весь каталог и фотографии
        env:
          EMALL_API_TOKEN: ${{ secrets.EMALL_API_TOKEN }}
        run: node scripts/import-emall-all.mjs
      - name: Сохранить пакет и отчёт
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: emall-all
          path: var/emall-all/
          retention-days: 7
          if-no-files-found: warn
