name: Массовый импорт Emall

on:
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: 'Номер успешного запуска для повтора только пропущенных товаров (необязательно)'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

jobs:
  prepare-drafts:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Установить зависимости
        run: npm ci --no-audit --no-fund
      - name: Проверить импорт на тестовых данных
        run: npm test
      - name: Восстановить предыдущий пакет
        if: inputs.resume_run_id != ''
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: emall-all
          path: var/emall-resume
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}
      - name: Получить весь каталог и фотографии
        env:
          EMALL_API_TOKEN: ${{ secrets.EMALL_API_TOKEN }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
        run: |
          if [ -n "$RESUME_RUN_ID" ]; then
            node scripts/import-emall-all.mjs --resume var/emall-resume
          else
            node scripts/import-emall-all.mjs
          fi
      - name: Сохранить пакет и отчёт
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: emall-all
          path: var/emall-all/
          retention-days: 7
          if-no-files-found: warn
